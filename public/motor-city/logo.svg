<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" width="240" height="52">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="logoAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (44x44) -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#logoBgGrad)" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Gear accents -->
    <path d="M22 5 L22 8 M34 10 L31 13 M39 22 L36 22 M34 34 L31 31 M22 39 L22 36 M10 34 L13 31 M5 22 L8 22 M10 10 L13 13" 
          stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Shield Badge -->
    <path d="M22 10 L32 14 C32 24 26 31 22 34 C18 31 12 24 12 14 Z" 
          fill="url(#logoBlueGrad)" stroke="#93c5fd" stroke-width="1" />

    <!-- Texas Star -->
    <polygon points="22,15 23.8,20 29,20 25,23 26.5,28 22,25 17.5,28 19,23 15,20 20.2,20" 
             fill="url(#logoAmberGrad)" stroke="#ffffff" stroke-width="0.5" />
  </g>

  <!-- Typography Right Column: Removed cluttered address, clean bold brand text -->
  <g transform="translate(60, 32)">
    <text x="0" y="0" font-family="'Syne', 'Inter', sans-serif" font-size="20" font-weight="800" fill="currentColor" letter-spacing="0.03em">
      MOTOR CITY <tspan fill="#3b82f6">AUTO</tspan>
    </text>
  </g>
</svg>
