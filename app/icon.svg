<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Minimalist Black Squircle -->
  <rect width="48" height="48" rx="10" fill="#000000" stroke="#333333" stroke-width="1.5" />
  
  <!-- Precision Measurement Grid Marks -->
  <line x1="8" y1="8" x2="14" y2="8" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="8" y1="8" x2="8" y2="14" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="40" y1="40" x2="34" y2="40" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="40" y1="40" x2="40" y2="34" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

  <!-- OM Monogram -->
  <text x="24" y="29" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1">OM</text>
</svg>