<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .badge {
      font-family: 'Patrick Hand', cursive, sans-serif;
      font-size: 72px;
      font-weight: bold;
      color: #2B2118;
      background: #F3B73B;
      border: 6px solid #2B2118;
      border-radius: 40px;
      padding: 4px 34px 12px 34px;
      box-shadow: 6px 6px 0 #2B2118;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      letter-spacing: 0.5px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="badge">Mezur</div>
</body>
</html>
